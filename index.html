<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF9F4">
<title>秘書</title>
<style>
  :root{
    --ink:#2A2823; --soft:#6E6C61; --line:#E6E3D9; --accent:#B85C3A; --accent-soft:#F3E4DB;
    --urgent:#A83B3B; --urgent-soft:#F6E2E0; --done:#5C7A5E; --done-soft:#E4EBE1;
    --paper:#FBF9F4; --card:#FFFFFF; --alt:#F6F3EC;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#EDE9DF; --soft:#A6A296; --line:#3A382F; --accent:#E08A63; --accent-soft:#3A2A22;
      --urgent:#E27C7C; --urgent-soft:#3E2626; --done:#8FB08F; --done-soft:#223226;
      --paper:#1C1B17; --card:#242219; --alt:#2A2820; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.7;padding:20px 16px calc(48px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto;}
  h1,h2,h3{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600;line-height:1.45}
  h1{font-size:22px;margin:6px 0 2px}
  .sub{font-size:12.5px;color:var(--soft)}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
  .refresh{font-size:12.5px;color:var(--accent);background:none;border:none;font-family:inherit;padding:4px 2px}
  .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0 26px}
  .counts div{background:var(--card);padding:11px 6px;text-align:center}
  .counts b{display:block;font-size:21px;font-family:"Hiragino Mincho ProN",serif}
  .counts span{font-size:10.5px;color:var(--soft)}
  section{margin-bottom:32px}
  .head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .head h2{font-size:19px;margin:0}
  .head .c{font-size:11.5px;color:var(--soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:14px}
  .card.gone{opacity:.5}
  .num{font-size:12px;color:var(--accent);font-weight:700}
  .title{font-size:17px;font-weight:700;line-height:1.45;margin:4px 0 10px}
  .body{font-size:14.5px;color:var(--ink);background:var(--alt);border:1px solid var(--line);
    border-radius:10px;padding:12px 13px;margin-top:12px;line-height:1.75}
  .body:empty{display:none}
  .body h2,.body h3{font-size:15.5px;color:var(--ink);margin:20px 0 6px;font-weight:700;padding-left:9px;border-left:3px solid var(--accent)}
  .body h4{font-size:14.5px;color:var(--ink);margin:16px 0 4px;font-weight:700}
  .body h2:first-child,.body h3:first-child,.body p:first-child{margin-top:0}
  .body p{margin:11px 0}
  /* 平文の段落でも階層が見えるようにする（行頭の印で判定。好み調査のカードなど） */
  .body p.lbl-diff{background:var(--accent-soft);border-left:3px solid var(--accent);padding:7px 9px;border-radius:8px;font-weight:700;font-size:14px;line-height:1.7;margin:2px 0 10px}
  .body p.lbl-hint{font-size:12.5px;color:var(--soft);font-weight:600;margin:0 0 10px}
  .body p.lbl-q{font-weight:700;font-size:15px;margin:12px 0 4px}
  .body p.lbl-pre{font-size:12.5px;color:var(--soft);margin:0 0 10px}
  .body p.opt{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 11px;margin:10px 0;font-size:14px;line-height:1.85}
  .body p.opt b{color:var(--accent);font-size:15.5px;margin-right:2px}
  .body p.opt-cont{background:var(--card);border-left:4px solid var(--accent);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 11px;margin:0;font-size:14px;line-height:1.85}
  .body p.opt-cont:last-child{border-bottom-left-radius:8px;border-bottom-right-radius:8px}
  .body ul,.body ol{margin:4px 0;padding-left:1.2em}
  .body li{margin:2px 0}
  .body table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0;display:block;overflow-x:auto}
  .body th,.body td{border:1px solid var(--line);padding:4px 6px;text-align:left}
  .body th{background:var(--card)}
  .body blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 0 2px 10px;color:var(--soft)}
  .body hr{border:0;border-top:1px solid var(--line);margin:10px 0}
  .body code{font-size:12px;background:var(--card);padding:1px 4px;border-radius:4px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  button.act{font-family:inherit;font-size:14px;font-weight:600;min-height:44px;padding:8px 13px;border-radius:9px;
    border:1px solid var(--line);background:var(--alt);color:var(--ink)}
  button.act.p{background:var(--accent);border-color:var(--accent);color:#fff}
  button.act.q{background:transparent}
  button.act:disabled{opacity:.45}
  button.act.done{background:var(--done-soft);border-color:var(--done);color:var(--done);opacity:1}
  textarea.cmt{width:100%;box-sizing:border-box;font-family:inherit;font-size:16px;line-height:1.5;
    padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink);
    min-height:104px;margin:9px 0 2px;resize:vertical}
  .row{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .sub{font-size:13px;color:var(--soft);margin:14px 0 6px;font-weight:600}
  .md{font-size:14px;line-height:1.85;color:var(--ink)}
  .md h2{font-size:15.5px;margin:16px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .md h3{font-size:14.5px;margin:13px 0 3px}
  .md h4{font-size:13.5px;margin:11px 0 2px}
  .md p{margin:9px 0}
  .md ul,.md ol{padding-left:1.2em;margin:6px 0}
  .md li{margin:3px 0}
  .md table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
  .md th{background:var(--done-soft)}
  .md code{background:var(--done-soft);padding:1px 4px;border-radius:5px;font-size:12.5px}
  .md pre{background:var(--done-soft);padding:9px;border-radius:9px;overflow-x:auto;font-size:12.5px}
  .md blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 0 2px 10px;color:var(--soft)}
  .md a{color:var(--accent)}
  button.sign{width:100%;font-family:inherit;font-size:15.5px;font-weight:700;letter-spacing:.02em;
    padding:15px 18px;border:none;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,var(--accent),#D9835B);
    box-shadow:0 6px 16px rgba(184,92,58,.28)}
  button.sign:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(184,92,58,.24)}
  button.sign:disabled{opacity:.5;box-shadow:none}
  .chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--alt);color:var(--soft);white-space:nowrap}
  .chip.u{background:var(--urgent-soft);color:var(--urgent)}
  .chip.d{background:var(--done-soft);color:var(--done)}
  .cwrap{margin-top:12px}
  .cinput{width:100%;min-height:96px;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);
    border-radius:9px;background:var(--alt);color:var(--ink);resize:vertical}
  .hint{font-size:12.5px;color:var(--soft);line-height:1.65;margin:0 0 12px;
    background:var(--alt);border-radius:10px;padding:9px 11px}
  .hint b{color:var(--ink)}
  .cnow{font-size:12.5px;color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:7px 10px;margin-top:8px}
  .stat{font-size:11.5px;color:var(--done);background:var(--done-soft);border-radius:8px;padding:5px 9px;margin-top:6px;display:none}
  button.act.det{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .meta{font-size:11.5px;color:var(--soft);margin-top:6px}
  .empty{font-size:13.5px;color:var(--soft);padding:10px 2px}
  #setup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  #setup input{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);
    border-radius:9px;background:var(--alt);color:var(--ink);margin:8px 0}
  #setup a{color:var(--accent);font-size:12.5px}
  .err{color:var(--urgent);font-size:13px}
  footer{font-size:11.5px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
  .busy{font-size:13px;color:var(--ink);min-height:16px}
  .busy:not(:empty){position:sticky;top:0;z-index:20;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:10px}
  button.act.p{font-size:15px;font-weight:700;min-height:46px}
  .upcard{background:var(--accent-soft);border-color:var(--accent)}
  .upcard .title{font-size:14.5px;margin:0 0 4px}
  .upcard ul{margin:2px 0 8px;padding-left:1.15em;font-size:13px}
  .sumbar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:0 0 10px;
    font-size:15px;font-weight:700;line-height:1.6}
  .sumbar .u{color:var(--urgent)}
  .upbar{margin:0 0 14px}
  .upbar>button.act{width:100%;text-align:left;font-size:13.5px}
  .upbar .upbody{display:none;margin-top:8px}
  .gist{font-size:15px;line-height:1.7;margin:2px 0 10px;font-weight:600}
  .gist .chg{display:block;font-size:14px;font-weight:400;color:var(--ink);margin-top:4px}
  .overdue,.title.overdue{color:var(--urgent)}
  .chip.u.over{color:var(--urgent);font-weight:800;border:1px solid var(--urgent)}
  .gist.missing{background:var(--urgent-soft);color:var(--urgent);border-radius:9px;padding:8px 11px;font-size:13.5px}
  .mainrow button.act{flex:1 1 30%;min-width:0}
  .mainrow button.act.p{flex:1 1 100%}
  /* 1枚モード（全画面。カードを1件だけ大きく出す） */
  #focus{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;-webkit-overflow-scrolling:touch;background:var(--paper);overflow-y:auto;
    padding:0 14px calc(28px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto}
  #focus .fbar{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;gap:8px;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line)}
  #focus .fbar button{flex:1 1 0;min-width:0;min-height:48px}
  #focus .fpos{font-size:14px;font-weight:700;color:var(--soft);white-space:nowrap}
  #focus .fmsg:not(:empty){background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:13.5px}
  #focus .fwhy{background:var(--urgent-soft);color:var(--urgent);font-weight:700;font-size:14.5px;border-radius:10px;padding:9px 12px;margin:10px 0}
  .card.focused{margin:0;padding:16px}
  .card.focused .title{font-size:21px;line-height:1.5}
  .card.focused .gist{font-size:17px;line-height:1.75}
  .card.focused .gist .chg{font-size:15.5px}
  .card.focused button.act{min-height:52px;font-size:16px}
  .noway{background:var(--urgent-soft);color:var(--urgent);font-weight:700;font-size:13.5px;
    border-radius:9px;padding:9px 11px;margin:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<footer id="foot" style="display:none">
  秘書（Hermes）・Notion の「秘書」ページだけを読み書きします。トークンはこの端末の中だけに保存されます。<a href="privacy.html" style="color:var(--accent)">プライバシーポリシー</a>　<a href="#" id="reset" style="color:var(--accent)">トークンを入れ直す</a>
</footer>
<script>
const REVIEW = "60242da1-b213-4118-ae82-f8782a816cb2";
const TASKS  = "ef21b283-795e-4fec-8311-2e40c4cb0c57";
const MEMO_PAGE = "3fde71bc-ecb6-81af-8624-ebb86a23bd14";
const SIGN_PAGE = "3fde71bc-ecb6-81f8-b7e0-f3408a247d50";
const REPORT_DS = "a54924f2-1ca7-44f5-b5d1-47576d368aff";
const QA_DS = "8d58d65b-8d15-4012-866a-772ee3942500";
const NV = "2025-09-03";
// アプリを直したら APP_VER を上げ、APP_NOTES に「何が変わったか」を書く。
// 次に開いたときだけ、上に「更新情報」として出る（「確認した」で消える）。
const APP_VER = "2026-10-25.2";
const APP_NOTES = [
  "判断カードの「コメントを書く」を開いても入力欄が出なかった不具合を直しました（7日以内のカードなど）。開くとすぐ書けます。",
  "いちばん上に「期限が近い3件」。押すとそのカードへ移動します。「▶ 1件ずつ」で、1枚ずつ大きく見て判断できます（判断すると次へ進みます）。",
  "判断カードは期限順・種類別に分け、30日より先のもの・Hermes 側の件・書き方のアンケートは畳みました。",
  "ボタンを押すと、カードに「何が保存されたか」と「取り消す」が出ます。「コメントを書く」の中は「直す内容を伝える／追加で調べてもらう／コメントだけ残す」です。",
  "「あとで」は明日の朝にまた出ます。「1週間後」で1週間先の日付に動かせます。期限を過ぎた件は赤字で「◯日過ぎています」と出ます。",
];
const app = document.getElementById("app");
const foot = document.getElementById("foot");
const $ = (t,c) => { const e=document.createElement(t); if(c) e.className=c; return e; };
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// 本文の段落を、行頭の印で見た目を変える（すべての文字が同じ大きさで読みにくい、という指摘への対応）
//   違いはここ: → 帯で強調／見分け方: → 小さめの補足／問い: → 見出し／前提: → 小さめの補足／1: 2: 3: → 選択肢の枠
const styleBody = (root) => {
  if(!root) return;
  let inOpt = false;
  root.querySelectorAll("p").forEach(p => {
    const t = (p.textContent || "").trim();
    if(/^違いはここ[:：]/.test(t)) { p.classList.add("lbl-diff"); inOpt = false; }
    else if(/^見分け方[:：]/.test(t)) { p.classList.add("lbl-hint"); inOpt = false; }
    else if(/^問い[:：]/.test(t)) { p.classList.add("lbl-q"); inOpt = false; }
    else if(/^前提[:：]/.test(t)) { p.classList.add("lbl-pre"); inOpt = false; }
    else if(/^[123][:：]/.test(t)) {
      p.classList.add("opt");
      p.innerHTML = p.innerHTML.replace(/^([123])[:：]\s*/, "<b>$1</b> ");
      inOpt = true;
    }
    else if(inOpt) { p.classList.add("opt-cont"); }   // 選択肢が複数段落にまたがる場合
  });
};
const stamp = () => { const n=new Date(), p=x=>String(x).padStart(2,"0");
  return n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate())+" "+p(n.getHours())+":"+p(n.getMinutes()); };

let token = localStorage.getItem("secretary_token") || "";
let busy = 0;

function setBusy(msg){
  let el = document.getElementById("busy");
  if(!el){ el = document.createElement("div"); el.id="busy"; el.className="busy"; }
  el.textContent = msg || "";
  const fm = document.getElementById("fmsg"); if(fm) fm.textContent = msg || "";   // 1枚モード中は、その画面にも同じ案内を出す
  if(!el.parentNode) app.prepend(el);
}

async function api(path, opts={}){
  const res = await fetch("https://api.notion.com/v1"+path, {
    ...opts,
    cache: "no-store",
    headers: { "Authorization":"Bearer "+token, "Notion-Version":NV, "Content-Type":"application/json", ...(opts.headers||{}) }
  });
  if(!res.ok){ throw new Error(res.status+" "+((await res.json().catch(()=>({}))).message||"") ); }
  return res.json();
}
const txt = v => { if(!v) return ""; const t=v.type;
  if(t==="title") return v.title.map(x=>x.plain_text).join("");
  if(t==="rich_text") return v.rich_text.map(x=>x.plain_text).join("");
  if(t==="select"||t==="status") return (v[t]||{}).name||"";
  if(t==="date") return (v.date||{}).start||"";
  if(t==="checkbox") return v.checkbox;
  return ""; };

function blockToHtml(b){
  const k = b.type;
  const rich = x => (x||[]).map(r => r.href ? '<a href="'+esc(r.href)+'">'+esc(r.plain_text)+"</a>"
      : (r.annotations&&r.annotations.bold ? "<b>"+esc(r.plain_text)+"</b>" : esc(r.plain_text))).join("");
  if(k==="heading_1"||k==="heading_2"||k==="heading_3") return "<h4>"+rich(b[k].rich_text)+"</h4>";
  if(k==="bulleted_list_item"||k==="numbered_list_item") return "<li>"+rich(b[k].rich_text)+"</li>";
  if(k==="paragraph"||k==="quote"||k==="callout"){
    const p = rich(b[k].rich_text);
    if((b[k].rich_text||[]).map(r=>r.plain_text).join("").trim().startsWith("やらないことを提案"))
      return '<div class="noway">'+p+'</div>';
    return "<div>"+p+"</div>"; }
  if(k==="to_do") return "<div>"+(b.to_do.checked?"☑ ":"☐ ")+rich(b.to_do.rich_text)+"</div>";
  if(k==="divider") return "<hr>";
  return "";
}
function blocksToHtml(blocks){
  let out = "", li = false;
  for(const b of blocks){
    const isLi = b.type==="bulleted_list_item"||b.type==="numbered_list_item";
    if(li && !isLi){ out += "</ul>"; li=false; }
    if(!li && isLi){ out += "<ul>"; li=true; }
    out += blockToHtml(b);
  }
  if(li) out += "</ul>";
  return out;
}

function blockText(b){
  const rt = (b[b.type] && b[b.type].rich_text) || [];
  return rt.map(x => x.plain_text).join("");
}

// 詳細の中身を、見出し・箇条書き・表・引用が使える形（Markdown 風の1本のテキスト）に整えてから表示する
function detailHtml(blocks){
  const out = [];
  for(const b of blocks){
    if(b.type==="paragraph") out.push(blockText(b));
    else if(b.type==="heading_1") out.push("# "+blockText(b));
    else if(b.type==="heading_2") out.push("## "+blockText(b));
    else if(b.type==="heading_3") out.push("### "+blockText(b));
    else if(b.type==="bulleted_list_item") out.push("- "+blockText(b));
    else if(b.type==="numbered_list_item") out.push("1. "+blockText(b));
    else if(b.type==="to_do") out.push((b.to_do.checked ? "- ✓ " : "- ") + blockText(b));
    else if(b.type==="quote") out.push("> "+blockText(b));
    else if(b.type==="callout") out.push("- "+blockText(b));
    else if(b.type==="code") out.push("```\n"+blockText(b)+"\n```");
    else if(b.type==="divider") out.push("---");
    else if(b.type==="table_row") out.push("| "+b.table_row.cells.map(c=>c.map(x=>x.plain_text).join("")).join(" | ")+" |");
  }
  const md = out.filter(x => x !== "").join("\n");
  const html = md ? mdToHtml(md) : "";
  return html || blocksToHtml(blocks);
}

// 本文の選択肢（「1: …」「2: …」の段落、または番号つきリスト）を読み取る。2つ以上そろったときだけ返す
function parseOptions(blocks){
  const toN = c => /[１-９]/.test(c) ? c.charCodeAt(0) - 65248 : +c;
  const all = []; let ord = 0;
  for(const b of (blocks||[])){
    const t = blockText(b).trim(); if(!t) continue;
    if(b.type === "numbered_list_item"){ ord++; all.push({n: ord, text: t}); continue; }
    ord = 0;
    for(const ln of t.split(/\r?\n/)){
      const m = ln.trim().match(/^([1-9１-９])[:：.．)）]\s*(.+)/);
      if(m) all.push({n: toN(m[1]), text: m[2].trim()});
    }
  }
  let seq = [];
  for(const o of all){
    if(o.n === seq.length + 1) seq.push(o);
    else if(o.n === 1 && seq.length >= 2) break;
    else if(o.n === 1) seq = [o];
  }
  return (seq.length >= 2 && seq.length <= 6) ? seq : [];
}
// レポートの「あなたに決めてほしいこと」の各質問の下に、選べるボタン（1〜4・はい・いいえ）を付ける。
// 選ぶと下のコメント欄に「Q1: はい」の形で入り、「コメントを送る」で Hermes に届く
function addReportChoices(root, cbox){
  const hs = [...root.querySelectorAll("h2,h3,h4")].find(h => /決めてほしい|決めてください|選んでください|番号で/.test(h.textContent));
  if(!hs) return;
  const lis = []; let el = hs.nextElementSibling;
  while(el && !/^H[2-4]$/.test(el.tagName)){
    if(el.tagName === "OL" || el.tagName === "UL") lis.push(...el.querySelectorAll(":scope > li"));
    el = el.nextElementSibling;
  }
  if(!lis.length) return;
  const note = document.createElement("div"); note.className = "meta";
  note.textContent = "各質問の下のボタンで選べます。選ぶと下のコメント欄に入るので、最後に「コメントを送る」を押してください。";
  hs.after(note);
  lis.forEach((li, i) => {
    const row = document.createElement("div"); row.className = "row"; row.style.margin = "4px 0 12px";
    const btns = [];
    ["1","2","3","4","はい","いいえ"].forEach(ch => {
      const b = document.createElement("button"); b.className = "act"; b.textContent = ch; b.style.minWidth = "48px";
      b.onclick = () => {

        lines.push(key+" "+ch);

        cbox.dispatchEvent(new Event("input"));
        btns.forEach(x => x.classList.toggle("done", x === b));
      };
      btns.push(b); row.appendChild(b);
    });
    li.appendChild(row);
  });
}
// レポート本文から、運用の内輪話の節（見出し〜次の同格の見出しまで）を取り除く
function stripInternal(md){
  const bad = /なぜ3回|いまの運用|現在の運用|自動処理|改訂メモ|未処理は|確定|次の\d+問/;
  let skip = 0; const out = [];
  for(const l of (md||"").split(/\r?\n/)){
    const m = l.match(/^(#{1,6})\s+(.*)$/);
    if(m){
      if(skip && m[1].length <= skip) skip = 0;
      if(!skip && bad.test(m[2])) skip = m[1].length;
    }
    if(!skip) out.push(l);
  }
  return out.join("\n");
}
function mdToHtml(md){
  const e2 = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const inline = s => e2(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = (md||"").split(/\r?\n/);
  let out=[], i=0, list=null, inCode=false, buf=[];
  const closeList = () => { if(list){ out.push("</"+list+">"); list=null; } };
  while(i<lines.length){
    const l = lines[i];
    if(l.trim().slice(0,3)==="```"){
      if(inCode){ out.push("<pre><code>"+e2(buf.join("\n"))+"</code></pre>"); buf=[]; inCode=false; }
      else { closeList(); inCode=true; }
      i++; continue;
    }
    if(inCode){ buf.push(l); i++; continue; }
    if(/^\s*$/.test(l)){ closeList(); i++; continue; }
    if(/^\|.*\|/.test(l) && i+1<lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])){
      closeList();
      const cells = s => s.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      let html = "<table><thead><tr>"+cells(l).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
      i += 2;
      while(i<lines.length && /^\|.*\|/.test(lines[i])){ html += "<tr>"+cells(lines[i]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; i++; }
      out.push(html+"</tbody></table>"); continue;
    }
    let m;
    if(m = l.match(/^(#{1,6})\s+(.*)$/)){
      closeList(); const lv=Math.min(4, Math.max(2, m[1].length+1));
      out.push("<h"+lv+">"+inline(m[2])+"</h"+lv+">"); i++; continue;
    }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(l)){ closeList(); out.push("<hr>"); i++; continue; }
    if(m = l.match(/^\s*[-*+]\s+(.*)$/)){
      if(list!=="ul"){ closeList(); out.push("<ul>"); list="ul"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if(m = l.match(/^\s*\d+[.)]\s+(.*)$/)){
      if(list!=="ol"){ closeList(); out.push("<ol>"); list="ol"; }
      out.push("<li>"+inline(m[1])+"</li>"); i++; continue;
    }
    if(m = l.match(/^>\s?(.*)$/)){
      closeList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); i++; continue;
    }
    closeList(); out.push("<p>"+inline(l)+"</p>"); i++;
  }
  closeList();
  if(inCode && buf.length) out.push("<pre><code>"+e2(buf.join("\n"))+"</code></pre>");
  return out.join("");
}

  try{

      const dk = d10 ? parseDue(d10) : null;
      top.innerHTML = (late?'<span class="chip u over">期限 '+esc(md)+(past?'（'+(dk?daysTxt(dk):'過ぎています')+'）':'（今日）')+'</span>'
                          : (due?'<span class="chip">期限 '+esc(md)+(dk?'（'+daysTxt(dk)+'）':'')+'</span>':""))+
                     (pri?'<span class="chip">優先度 '+esc(pri)+'</span>':"");
      const tl = card.querySelector(".title"); if(tl) tl.classList.toggle("overdue", !!late);
      card.classList.toggle("late", !!late);   // 「期限切れ・今日のタスク」ボタンの飛び先
      for(const o of dueBtns){
        const d2 = new Date(); d2.setDate(d2.getDate()+o.days);
        const p2 = x => String(x).padStart(2,"0");
        const ds2 = d2.getFullYear()+"-"+p2(d2.getMonth()+1)+"-"+p2(d2.getDate());
        const same = due === ds2;
        o.btn.textContent = same ? "期限を取り消す" : o.label;
        o.btn.classList.toggle("done", same);
      }
    };
    paintTop();
    card.appendChild(top);
    const tt=$("div","title"); tt.textContent = name; card.appendChild(tt);
    paintTop();   // 題名ができたので、期限切れ・今日なら題名も赤にする
    // メモはカード上に単独で出さず、「詳細を開く」の中にまとめて表示する（二重表示を防ぐ）

    // 詳細（タスクのページ本文をトグルで開く）
    const detail = $("div","body"); detail.style.display="none";
    const db = $("button","act q det"); db.textContent="詳細を開く";
    db.onclick = async () => {
      if(detail.style.display==="none"){
        if(!detail.dataset.loaded){
          setBusy("詳細を読み込み中…"); db.disabled = true;
          try{
            const bb = await api("/blocks/"+t.id+"/children?page_size=50");
            let dhtml = detailHtml(bb.results);
            // メモを詳細の先頭にまとめる（カード上の二重表示をやめた分をここに集約）
            if(memo) dhtml = '<div class="cnow">メモ: '+esc(memo)+'</div>' + dhtml;
            detail.innerHTML = dhtml || '<div class="sub">このタスクにはまだ詳細がありません（結果は Discord の該当メッセージにあります）。</div>';
          }catch(e){ detail.innerHTML = '<div class="sub">詳細を読み込めませんでした。</div>'; }
          detail.dataset.loaded="1"; db.disabled = false; setBusy("");
        }
        detail.style.display="block"; db.textContent="詳細を閉じる";
      } else { detail.style.display="none"; db.textContent="詳細を開く"; }
    };

    const row=$("div","row mainrow");
    // コメントの保存状況をカード内に出す（ページ上部の一時メッセージは見落としやすいため）
    let savedMemo = memo;
    const cstat = $("div","stat");
    const b=$("button","act p"); b.textContent="完了";
    b.onclick = async () => { b.disabled=true; setBusy("完了にしています…");
      // 書きかけのコメントが残っていたら、完了と一緒に保存する（保存できたかを画面に出す）
      const cv = (cta.value || "").trim();
      const dirty = cv !== savedMemo;
      try{ const props = {"状態":{"select":{"name":"完了"}}, "完了日":{"date":{"start":today}} };
        if(dirty) props["メモ"] = {"rich_text": cv ? [{"type":"text","text":{"content":cv}}] : []};
        await api("/pages/"+t.id,{method:"PATCH",body:JSON.stringify({properties: props})});
        if(dirty){ savedMemo = cv; try{ localStorage.removeItem(tkey); }catch(e){}
          cstat.textContent = (cv ? "書きかけのコメントも保存しました（"+stamp()+"）" : "コメントを空にしました（"+stamp()+"）");
          cstat.style.display="block"; }
        card.classList.add("gone");
        const undo=$("button","act q"); undo.textContent="取り消す（未着手に戻す）";
        undo.onclick = async () => { undo.disabled=true; setBusy("戻しています…");
          try{ await api("/pages/"+t.id,{method:"PATCH",body:JSON.stringify({properties:{
                "状態":{"select":{"name":"未着手"}}, "完了日":{"date":null}}})});
            card.classList.remove("gone"); b.disabled=false; undo.remove(); setBusy("未着手に戻しました"); }
          catch(e){ setBusy("失敗: "+e.message); undo.disabled=false; } };
        row.appendChild(undo);
        setBusy("完了にしました。まちがえたら「取り消す」で戻せます。"); }
      catch(e){ setBusy("失敗: "+e.message); b.disabled=false; } };
    const bq=$("button","act");
    const qkey = "asked_"+t.id;
    const qline = $("div","stat");
    const markAsked = (msg, compact) => { bq.textContent="依頼済み ✓"; bq.disabled=true; bq.classList.add("done");
      if(compact){ qline.style.display="none"; return; }
      qline.textContent = msg || "送信を確認しました。Hermes が次回の確認で拾って、Discord でお返事します。";
      qline.style.display="block"; };
    if(localStorage.getItem(qkey) && handled){
      // 「調べました」は欄を増やさず、詳細ボタンの色で示す（場所を取らない）
      markAsked("", true); bq.textContent="調べました ✓"; db.classList.add("done"); }
    else if(localStorage.getItem(qkey)){ markAsked("送信済みです。Hermes が次の確認（1分ごと）で拾います。"); }
    else { bq.textContent="調べてもらう"; }
    bq.onclick = async () => {
      bq.disabled=true; bq.textContent="送信中…"; bq.classList.remove("done"); setBusy("依頼を送っています…");
      const lineText = stamp()+" 端末から: 【調べてもらう】"+name+" について調べて、Discord で教えてください。";
      try{
        await api("/blocks/"+MEMO_PAGE+"/children", {method:"PATCH", body:JSON.stringify({
          children:[{"object":"block","type":"paragraph","paragraph":{"rich_text":[
            {"type":"text","text":{"content":lineText}}]}}]})});
        // 送れたかどうかを、ページを読み直して確認する
        const chk = await api("/blocks/"+MEMO_PAGE+"/children?page_size=100");
        const ok = chk.results.some(x => x.type==="paragraph" &&
          x.paragraph.rich_text.map(r=>r.plain_text).join("") === lineText);
        if(!ok) throw new Error("確認できませんでした");
        try{ localStorage.setItem(qkey,"1"); }catch(e){}
        markAsked();
        setBusy("依頼を送りました（送信を確認しました）");
      }catch(e){
        bq.disabled=false; bq.textContent="調べてもらう"; bq.classList.remove("done");
        setBusy("送れませんでした。もう一度押してください。");
      }
    };
    row.appendChild(b);   // 主ボタンは「完了」「あとで（明日の朝）」「1週間後」の3つ。詳細・調べてもらう・コメントは「詳細・コメント」の中
    // 延期したとき、いつ戻ってくるかを小さく出す
    const dnote = $("div","meta"); dnote.style.display = "none";
    // リマインド（期限を明日／来週に）
    const mkDue = (label, days) => {
      const btn = $("button","act"); btn.textContent = label;
      dueBtns.push({btn: btn, label: label, days: days});
      paintTop();
      btn.onclick = async () => {
        btn.disabled = true;
        const d = new Date(); d.setDate(d.getDate()+days); const p = x => String(x).padStart(2,"0");
        const ds = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
        const wasSame = due === ds;
        setBusy(wasSame ? "期限を取り消しています…" : "期限を設定しています…");
        try{
          const body = wasSame ? {"期限":{"date":null}} : {"期限":{"date":{"start":ds}}};
          await api("/pages/"+t.id, {method:"PATCH", body:JSON.stringify({properties:body})});
          due = wasSame ? "" : ds;
          paintTop();
          dnote.textContent = wasSame ? "" : (days===1 ? "明日" : "来週")+"（"+(d.getMonth()+1)+"/"+d.getDate()+"）にまた出ます。";
          dnote.style.display = wasSame ? "none" : "block";
          setBusy(wasSame ? "期限を取り消しました" : "期限を "+ds+" にしました（スマホへの通知はカレンダー経由です）");
        }
        catch(e){ setBusy("失敗: "+e.message); }
        btn.disabled=false;
      };
      return btn;
    };
    row.appendChild(mkDue("あとで（明日の朝）", 1));
    { const wd = new Date(); wd.setDate(wd.getDate()+7);
      row.appendChild(mkDue("1週間後（"+(wd.getMonth()+1)+"/"+wd.getDate()+" "+"日月火水木金土"[wd.getDay()]+"）", 7)); }
    card.appendChild(row);
    card.appendChild(dnote);
    const tmore = $("div"); tmore.style.display = "none";
    const mrow = $("div","row"); mrow.append(db, bq);
    tmore.append(mrow, qline);
    const tmbtn = $("button","act q"); tmbtn.style.width = "100%"; tmbtn.style.marginTop = "8px";
    const paintTMore = (o) => { tmore.style.display = o ? "block" : "none";
      tmbtn.textContent = o ? "✎ 詳細・コメント ▲（閉じる）" : "✎ 詳細・コメント ▼（コメントも書けます）"; };
    tmbtn.onclick = () => paintTMore(tmore.style.display === "none");
    paintTMore(false);
    card.appendChild(tmbtn); card.appendChild(tmore);
    // タスクへのコメント（メモ欄に保存する）
    const cwrap = $("div","cwrap");
    const cta = document.createElement("textarea"); cta.className = "cmt"; cta.rows = 2;
    cta.placeholder = "このタスクへのコメント（メモ欄に保存します）";
    const tkey = "tdraft_"+t.id;
    // コメント欄は空から始める（メモは「詳細を開く」の中に出す。本人の下書きだけ復元）
    cta.value = localStorage.getItem(tkey) || "";
    cta.oninput = () => { try{ localStorage.setItem(tkey, cta.value); }catch(e){} };
    cwrap.appendChild(cta);
    const crow = $("div","row");
    const csave = $("button","act"); csave.textContent = "コメントを保存";
    csave.onclick = async () => {
      csave.disabled = true; setBusy("保存しています…");
      const v = cta.value.trim();
      try{ await api("/pages/"+t.id, {method:"PATCH", body:JSON.stringify({properties:{
            "メモ":{"rich_text": v ? [{"type":"text","text":{"content":v}}] : []}}})});
        // 本当に保存されたかをページを読み直して確かめてから「保存済み」を出す
        const chk = await api("/pages/"+t.id);
        if(txt(chk.properties["メモ"]) !== v) throw new Error("確認できませんでした");
        savedMemo = v; try{ localStorage.removeItem(tkey); }catch(e){}
        csave.textContent = "保存済み ✓";
        cstat.textContent = "コメントを保存しました（"+stamp()+"）"+(v ? "： "+v.slice(0,40)+(v.length>40?"…":"") : "（空にしました）");
        cstat.style.display="block";
        setBusy("コメントを保存しました"); }
      catch(e){ csave.textContent = "コメントを保存"; setBusy("保存できませんでした。もう一度押してください。"); }
      csave.disabled = false;
    };
    crow.appendChild(csave); cwrap.appendChild(crow);
    tmore.appendChild(cwrap);
    card.appendChild(cstat);
    if(cta.value) paintTMore(true);   // 書きかけがあれば開いておく
    card.appendChild(detail);
    return card;
  };
  // Hermes 自身の作業は「私の作業」に畳み、あなたのタスクと混ぜない（期限切れの数にも入れない）
  // 返事待ち（待つだけ）と私用は、仕事のタスクと混ざらないよう別の折りたたみに分ける
  const hermesTasks = normal.filter(isInternalTask);
  const rest = normal.filter(t => !isInternalTask(t));
  const waitTasks = rest.filter(isWaiting), privTasks = rest.filter(t => !isWaiting(t) && isPrivate(t));
  const myTasks = rest.filter(t => !isWaiting(t) && !isPrivate(t));
  for(const t of myTasks) s2.appendChild(taskCard(t));
  const addTaskFold = (label, list) => {
    if(!list.length) return;
    const hb = $("div"), hbtn = $("button","act q");
    hb.style.display = "none"; hbtn.style.cssText = "display:block;width:100%;text-align:left;margin-top:12px";
    let ho = false;
    const paintH = () => { hb.style.display = ho ? "block" : "none"; hbtn.textContent = label+" "+list.length+"件"+(ho ? " ▲" : " ▼"); };
    paintH();
    hbtn.onclick = () => { ho = !ho; if(ho && !hb.dataset.loaded){ for(const t of list) hb.appendChild(taskCard(t)); hb.dataset.loaded = "1"; } paintH(); };
    s2.append(hbtn, hb);
  };
  addTaskFold("⏳ 返事待ち（待つだけ）", waitTasks);
  addTaskFold("🏠 私用", privTasks);
  addTaskFold("🔧 Hermes 側の作業（あなたの対応は不要）", hermesTasks);
  if(lowPri.length){
    const h = $("div","sub");
    const toggle = $("button","act q");
    toggle.style.display = "block"; toggle.style.width = "100%"; toggle.style.textAlign = "left";
    let opened = false;
    const box = $("div"); box.style.display = "none";
    const paint = () => { toggle.textContent = (opened ? "▼ " : "▶ ") + "低優先度のタスク（" + lowPri.length + "件）" + (opened ? "（たたむ）" : "（開く）"); };
    paint();
    toggle.onclick = () => {
      opened = !opened;
      if(opened && !box.dataset.loaded){ for(const t of lowPri) box.appendChild(taskCard(t)); box.dataset.loaded = "1"; }
      box.style.display = opened ? "block" : "none";
      paint();
    };
    h.appendChild(toggle);
    s2.appendChild(h); s2.appendChild(box);
  }
  app.appendChild(s2);

  if(!s0.dataset.hide) app.appendChild(s0);   // 数字が取れなかった残高欄は出さない

  // ---- 確認サイン（読了ボタン） ----
  const s4 = $("section");
  s4.innerHTML = "";
  const srow = $("div","row");
  const sbtn = $("button","sign"); sbtn.textContent = "✅ ここまでの入力を Hermes に渡す";
  const lastSign = localStorage.getItem("last_sign") || "";
  const sstat = $("div","meta"); sstat.textContent = lastSign ? ("最終: " + lastSign) : "まだ押していません";
  sbtn.onclick = async () => {
    sbtn.disabled = true; setBusy("送っています…");
    const n = new Date(); const pad = x => String(x).padStart(2,"0");
    const stamp = n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())+" "+pad(n.getHours())+":"+pad(n.getMinutes());
    try{
      // 未保存のコメント・メモを先に保存してから合図を出す（書きかけで判断されないように）
      try{
        const keys = [];
        for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i);
          if(k && k.startsWith("draft_") && !k.startsWith("draft_q_") && !k.startsWith("draft_rep_") && k !== "draft_memo") keys.push(k); }
        for(const k of keys){
          const v = (localStorage.getItem(k) || "").trim();
          const id = k.slice(6);
          if(!v || id.length < 30) continue;
          await api("/pages/"+id, {method:"PATCH", body:JSON.stringify({properties:{
            "コメント":{"rich_text":[{"type":"text","text":{"content":v}}]}}})});
          try{ localStorage.removeItem(k); }catch(e){}
        }
        const md = (localStorage.getItem("draft_memo") || "").trim();
        if(md){
          await api("/blocks/"+MEMO_PAGE+"/children", {method:"PATCH", body:JSON.stringify({
            children:[{"object":"block","type":"paragraph","paragraph":{"rich_text":[
              {"type":"text","text":{"content":stamp+" 端末から: "+md}}]}}]})});
          try{ localStorage.removeItem("draft_memo"); }catch(e){}
        }
        // タスクのコメント欄（書きかけ）も先に保存する
        const tkeys = [];
        for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i);
          if(k && k.startsWith("tdraft_")) tkeys.push(k); }
        for(const k of tkeys){
          const v = (localStorage.getItem(k) || "").trim();
          const id = k.slice(7);
          if(!v || id.length < 30) continue;
          await api("/pages/"+id, {method:"PATCH", body:JSON.stringify({properties:{
            "メモ":{"rich_text":[{"type":"text","text":{"content":v}}]}}})});
          try{ localStorage.removeItem(k); }catch(e){}
        }
      }catch(e){}
      await api("/blocks/"+SIGN_PAGE+"/children", {method:"PATCH", body:JSON.stringify({
        children:[{"object":"block","type":"paragraph","paragraph":{"rich_text":[
          {"type":"text","text":{"content":"読了: "+stamp}}]}}]})});
      try{ localStorage.setItem("last_sign", stamp); }catch(e){}
      sstat.textContent = "最終: " + stamp;
      setBusy("送りました。1分以内に確認します。");
      sbtn.textContent = "✅ 渡しました";
      return; // 押したあとはグレーアウトしたまま（再読み込みで戻る）
    }catch(e){ setBusy("失敗: "+e.message); }
    sbtn.disabled = false;
  };
  srow.appendChild(sbtn);
  s4.appendChild(srow);
  s4.appendChild(sstat);
  app.appendChild(s4);

  // ---- 改善したい点 ----
  const s3 = $("section");
  s3.innerHTML = '<div class="head"><h2>改善したい点</h2></div>';
  // 説明は枠なしの小さな文で置く（場所を取らない）
  const h3 = $("div","sub");
  h3.style.fontWeight = "400"; h3.style.margin = "0 0 10px";
  h3.textContent = "使いにくいところ、欲しい機能、こう動いてほしい、などを書いて送ってください。書いて送ったあと、いちばん下の「✅ ここまでの入力を Hermes に渡す」を押すと、その時点の内容で Hermes が動きます。対応済みのメモはここには出ません。";
  s3.appendChild(h3);
  const fbox = $("div","cwrap");
  const ftext = document.createElement("textarea");
  ftext.className = "cinput";
  ftext.placeholder = "例: タスクにも「明日に」ボタンが欲しい／判断の一覧が長いときは畳みたい";
  ftext.value = localStorage.getItem("draft_memo") || "";
  ftext.addEventListener("input", ()=>{ try{ localStorage.setItem("draft_memo", ftext.value); }catch(e){} });
  fbox.appendChild(ftext);
  const frow = $("div","row");
  const fsend = $("button","act p"); fsend.textContent = "送信";
  const recent = $("div","body"); recent.id = "memo-recent";
  s3.appendChild(fbox);
  frow.appendChild(fsend);
  fbox.appendChild(frow);
  s3.appendChild(recent);
  app.appendChild(s3);
  if(uc) app.appendChild(uc);   // 更新情報は最下部

  async function loadMemo(){
    try{
      const b = await api("/blocks/"+MEMO_PAGE+"/children?page_size=100");
      const all = b.results.filter(x => x.type==="paragraph")
        .map(x => x.paragraph.rich_text.map(r=>r.plain_text).join("").trim())
        .filter(t => t);
      const pending = [];
      for(let i=0;i<all.length;i++){
        if(/^\d{4}-\d{2}-\d{2}/.test(all[i])){
          let handled = false;
          for(let j=i+1;j<all.length;j++){
            if(/^\d{4}-\d{2}-\d{2}/.test(all[j])) break;
            if(all[j].replace(/^-\s*/,"").startsWith("対応:")){ handled = true; break; }
          }
          if(!handled) pending.push(all[i]);
        }
      }
      const last = pending.slice(-4).reverse();
      recent.innerHTML = last.length
        ? "<h4>まだ対応していないメモ</h4>" + last.map(t => "<div>・"+esc(t)+"</div>").join("")
        : '<div class="sub">未対応のメモはありません。対応済みは Notion の「🔧 アプリの改善メモ」に残っています。</div>';
    }catch(e){ recent.innerHTML = ""; }
  }
  fsend.onclick = async () => {
    const v = ftext.value.trim();
    if(!v){ setBusy("内容を書いてください"); ftext.focus(); return; }
    fsend.disabled = true; setBusy("送信中…");
    try{
      await api("/blocks/"+MEMO_PAGE+"/children", {method:"PATCH", body:JSON.stringify({
        children:[{"object":"block","type":"paragraph","paragraph":{"rich_text":[
          {"type":"text","text":{"content":stamp()+" 端末から: "+v}}]}}]})});
      ftext.value = ""; try{ localStorage.removeItem("draft_memo"); }catch(e){}
      setBusy("送りました"); loadMemo();
    }catch(e){ setBusy("失敗: "+e.message); }
    fsend.disabled = false;
  };
  loadMemo();

  setBusy("");
}

function setupCard(err){
  const box = $("div"); box.id="setup";
  box.innerHTML = '<h2 style="font-size:16px;margin:0 0 6px">はじめての設定</h2>'+
    '<div class="sub">Notion の連携トークンを一度だけ貼り付けてください。この端末の中だけに保存します。</div>'+
    (err?'<div class="err" style="margin-top:8px">'+esc(err)+'</div>':"")+
    '<input type="password" id="tok" placeholder="ntn_ または secret_ で始まる文字列" autocomplete="off">'+
    '<button class="act p" id="save">保存して読み込む</button>'+
    '<div style="margin-top:10px"><a href="https://www.notion.so/my-integrations" target="_blank">連携トークンの場所（notion.so/my-integrations）</a></div>'+
    '<div class="sub" style="margin-top:8px">「秘書」ページとその下の2つのデータベースに、その連携を共有しておいてください。</div>';
  document.getElementById("foot").style.display="block";
  setTimeout(()=>{
    document.getElementById("save").onclick = () => {
      const v = document.getElementById("tok").value.trim();
      if(!v) return;
      token = v; localStorage.setItem("secretary_token", v); load();
    };
  },0);
  return box;
}

function boot(){
  document.getElementById("foot").style.display = token ? "block" : "none";
  document.getElementById("reset").onclick = (e)=>{ e.preventDefault();
    localStorage.removeItem("secretary_token"); token=""; boot(); };
  if(!token){ app.appendChild(setupCard("")); return; }
  load();
}
boot();
</script>
</body>
</html>
